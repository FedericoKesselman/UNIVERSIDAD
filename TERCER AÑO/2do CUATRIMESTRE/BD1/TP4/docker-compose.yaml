version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: mysql_tp4
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: appointments
    ports:
      - "3306:3306"
    volumes:
      - ./mysql_data:/var/lib/mysql
      - ./scripts:/docker-entrypoint-initdb.d

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin_tp4
    restart: always
    ports:
      - "8080:80"
    environment:
      PMA_HOST: mysql